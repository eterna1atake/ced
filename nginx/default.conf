server {
    listen 80 default_server;
    server_name btct.ced.kmutnb.ac.th btct.ced.kmuntb.ac.th localhost _;

    # Important for sub-path behind another proxy
    absolute_redirect off; 

    # Handle root redirects
    location = / {
        return 301 /cedweb/;
    }

    location = /cedweb {
        return 301 /cedweb/;
    }

    # Main site location
    location /cedweb/ {
        proxy_pass http://ced-webapp:3006;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Add subpath prefix to inform the app
        proxy_set_header X-Forwarded-Prefix /cedweb;

        # Standard timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 'OK';
    }
}

