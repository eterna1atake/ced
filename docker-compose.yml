version: '3.8'

services:
  # --- Nginx Gateway (Port 80) ---
  ced-nginx:
    image: nginx:alpine
    container_name: ced-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ced-webapp
    networks:
      - ced-network

  # --- CED Web Application ---
  ced-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ced-webapp
    restart: always
    # We don't expose 3006 to the public anymore, Nginx handles it
    expose:
      - "3006"
    env_file:
      - .env.local
    networks:
      - ced-network

networks:
  ced-network:
    driver: bridge
