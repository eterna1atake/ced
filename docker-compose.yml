services:
  ced-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ced-webapp
    restart: always
    ports:
      - "${DOCKER_APP_PORT:-3006}:3006"
    env_file:
      - .env
    environment:
      - PORT=3006
      - HOSTNAME=0.0.0.0
    # Optional: If you use local MongoDB, uncomment below
